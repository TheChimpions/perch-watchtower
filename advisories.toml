# Kernel advisories built into perch.
#
# Every perch with [[hosts]] configured tracks these without being told to,
# reading only the kernel version, which needs no privilege. An operator who
# has applied an advisory's stopgap lists its id under the host's `mitigated`.
# They add their own with [[advisories]] in the config, replaces one of
# these by declaring the same id, and drops one with
# `[checks.host_advisory] ignore = ["<id>"]`.
#
# What belongs here: a kernel vulnerability that the validator client teams or
# the Solana Foundation have asked every operator to act on. Not every kernel
# CVE: a list nobody reads protects nobody.
#
# An entry is removed once the fix is in every kernel a supported distribution
# still ships, which closes anything it left open on the boxes that had it.
#
# The schema is the config's [[advisories]]; `cargo test` parses and validates
# this file.

[[advisories]]
id = "CVE-2026-99288"
name = "NoisyTCP"
# Upstream stable releases carrying the fix (mainline 4e2b3ef19e0e).
fixed_in = ["6.12.117", "6.18.63", "7.3.4"]
# Distribution kernels number differently; Ubuntu's are looked up.
tracker = "ubuntu"
url = "https://www.openwall.com/lists/oss-security/2026/11/15/2"

[advisories.mitigation]
sysctl = "net.ipv4.tcp_syncookies"
value = 0

# TCP use-after-free reachable by a remote, unauthenticated peer through IPv4
# header options. Ubuntu rates it critical.
#
# No `mitigation` table: the stopgap that closes the remote path is a firewall
# rule, not one sysctl. The operator applies the steps in `note` and lists the
# id under the host's `mitigated`.
[[advisories]]
id = "CVE-2026-98432"
name = "TCP IPv4 options use-after-free"
# Upstream stable releases carrying the fix; 7.3 and later were released with it.
fixed_in = ["5.10.272", "5.15.223", "6.1.190", "6.6.159", "6.12.113", "6.18.56", "7.2.10"]
tracker = "ubuntu"
url = "https://ubuntu.com/security/CVE-2026-98432"
note = "Until it is running, drop inbound TCP packets that carry IPv4 options at the firewall, and set net.mptcp.enabled=0 and net.ipv4.tcp_migrate_req=0."
