[package]
name = "perch"
version = "1.1.0"
edition = "2021"
# Validator hosts often run whatever Rust shipped with the distro. Keeping this
# low, and shipping Cargo.lock, means the build does not demand a fresh toolchain.
rust-version = "1.85"
description = "A Solana validator watchtower that refuses to page you for transient RPC failures"
license = "Apache-2.0"

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Already in the tree through reqwest; used directly to read feature accounts.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
humantime = "2"
humantime-serde = "1"
rand = "0.8"
# Pre-release ordering (4.3.0-rc.0 < 4.3.0-rc.1 < 4.3.0) is what a hand-rolled
# comparison gets wrong, and SFDP floors are routinely release candidates.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
