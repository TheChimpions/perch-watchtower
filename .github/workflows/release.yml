name: release

# Push a tag like v1.0.0 to publish static Linux binaries, SHA256SUMS, a build
# provenance attestation for each, and install.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag that disagrees with Cargo.toml ships a binary that reports the wrong
  # version in --version, status, and perch_build_info. v1.0.1 did exactly that.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      # Static musl binaries: no glibc version to match, so one build runs on
      # every distro a validator is likely to be on.
      - run: pip install "cargo-zigbuild==0.23.4" "ziglang==0.13.0"
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          d=perch-${{ matrix.target }}
          mkdir -p "$d/scripts"
          cp target/${{ matrix.target }}/release/perch "$d/"
          cp -r perch.service config.example.toml examples LICENSE NOTICE README.md SECURITY.md "$d/"
          cp scripts/install.sh "$d/scripts/"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perch-${{ matrix.target }}
          path: perch-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - run: |
          cp scripts/install.sh .
          sha256sum perch-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS
      # Lets anyone check a download was built by this workflow from this repo:
      #   gh attestation verify perch-x86_64-unknown-linux-musl.tar.gz -R TheChimpions/perch-watchtower
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            perch-*.tar.gz
            install.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" perch-*.tar.gz install.sh SHA256SUMS --generate-notes --verify-tag
