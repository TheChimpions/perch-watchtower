name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here publishes anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.85 is the declared rust-version: the build must stay within reach
        # of whatever Rust a validator host's distro ships.
        toolchain: ["1.85", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/install.sh
