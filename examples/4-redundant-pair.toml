# TWO FULL WATCHTOWERS, ONE ALERTS AT A TIME
#
# For two machines that both watch everything. Because they share a scope, they
# would otherwise both page for the same event -- so here priority decides which
# one speaks, and the other takes over if it goes quiet.
#
# Use this only when the instances genuinely overlap. If each watches its own
# validator, use alerting = "always" (layout 2): disjoint scopes need no
# arbitration.
#
# Deploy twice, changing name and priority. Lower priority alerts first.

[watchtower]
name = "watchtower-a"
cluster = "mainnet-beta"
interval = "60s"

[[endpoints]]
name = "provider-a"
url = "https://..."
[[endpoints]]
name = "provider-b"
url = "https://..."
[[endpoints]]
name = "provider-c"
url = "https://..."

[peering]
name = "watchtower-a"
alerting = "auto"
priority = 1
stale_after = "3m"
# A brief blip must not cause a handoff.
takeover_after = "5m"

[[peers]]
name = "watchtower-b"
url = "http://10.0.0.9:9469/metrics"
priority = 2

[[validators]]
identity = "YOUR_IDENTITY_PUBKEY"
vote_account = "YOUR_VOTE_PUBKEY"
label = "chimps-1"

[notify.pagerduty]
integration_key = "env:PAGERDUTY_INTEGRATION_KEY"

[notify.telegram]
bot_token = "env:TELEGRAM_BOT_TOKEN"
chat_id = "env:TELEGRAM_CHAT_ID"

[heartbeat]
url = "env:HEARTBEAT_URL"

[state]
file = "/var/lib/perch/state.json"

[silence]
# Written by `perch maint`. See config.example.toml.
file = "/var/lib/perch/maint/silence"

[metrics]
listen = "10.0.0.8:9469"
